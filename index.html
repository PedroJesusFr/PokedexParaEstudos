<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js"></script>
    <title>Minha Pokédex</title>
</head>

<body>
    <header>
        <h1>Minha Pokedex :]</h1>
    </header>
    <main>
        <label for="nome">Nome:</label>
        <input type="text" placeholder="Digite algo..." id="nome" />
        <section class="pokemon-container">
            <article>
                <h2>Bulbasaur</h2>
                <p>#001</p>
                <img src="assets/images/001.png" alt="Bulbasaur, o Pokemon semente." />
            </article>
            <article>
                <h2>Charmander</h2>
                <p>#004</p>
                <img src="assets/images/Charmander.png" alt="Charmander, o Pokemon lagarto." />
            </article>
            <article>
                <h2>Squirtle</h2>
                <p>#007</p>
                <img src="assets/images/007.png" alt="Squirtle, o Pokemon tartaruguinha." />
            </article>
        </section>
    </main>
</body>
</html>
